name: Weekly SBTET Fetcher
on:
  schedule:
    # 12:37 UTC converts exactly to 6:07 PM IST EVERY SUNDAY
    - cron: '37 1 * * 0'
    # 03:12 UTC converts to 8:42 AM IST EVERY THURSDAY
    - cron: '12 1 * * 4'
  workflow_dispatch:

jobs:
  run-attendance-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread pandas python-dotenv google-auth-oauthlib google-api-python-client

      - name: Create credentials.json file
        # This continues using your existing secret to build the Google Sheets access key
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run the Python Script
        env:
          # 1. Inject your Gmail API background refresh token
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          # 2. Inject your target database sheet tracking key
          GOOGLE_SHEET_KEY: ${{ secrets.GOOGLE_SHEET_KEY }}
          # 3. [NEW] Inject your Google Apps Script Tracking Pixel URL
          TRACKING_WEB_APP_URL: ${{ secrets.TRACKING_WEB_APP_URL }}
          # 4. [NEW] Inject your personal Admin Email for failure alerts
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SBTET_URL: ${{ secrets.SBTET_URL }}
        run: python main.py
